services:
  - type: web
    name: estate-backend
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /api/properties
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: APP_CORS_ORIGINS
        sync: false