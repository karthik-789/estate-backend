server:
  port: ${PORT:${SERVER_PORT:8080}}
spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/realestate_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 25MB
app:
  jwt:
    secret: ${JWT_SECRET:}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors-origins: ${APP_CORS_ORIGINS:http://localhost:5173}
  upload-dir: ${UPLOAD_DIR:uploads}
  seed:
    demo-password: ${APP_SEED_DEMO_PASSWORD:}

